<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Random Quote Generator</title>
<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .quote-box {
    background: white;
    border-radius: 16px;
    padding: 40px 30px;
    max-width: 500px;
    width: 85%;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }

  #quoteText {
    font-size: 22px;
    color: #333;
    margin-bottom: 20px;
    min-height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #quoteAuthor {
    font-size: 16px;
    color: #764ba2;
    font-weight: bold;
    margin-bottom: 25px;
  }

  button {
    background: #764ba2;
    color: white;
    border: none;
    padding: 12px 28px;
    border-radius: 30px;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #5e3a85; }
</style>
</head>
<body>

<div class="quote-box">
  <div id="quoteText">"Click the button to get inspired!"</div>
  <div id="quoteAuthor"></div>
  <button onclick="newQuote()">✨ New Quote</button>
</div>

<script>
  // ---------------------------------------------------
  // DATA: our list of quotes.
  // Each quote is an object with text and an author.
  // ---------------------------------------------------
  const quotes = [
    { text: "The only way to do great work is to love what you do.", author: "Steve Jobs" },
    { text: "Life is what happens when you're busy making other plans.", author: "John Lennon" },
    { text: "Success is not final, failure is not fatal: it is the courage to continue that counts.", author: "Winston Churchill" },
    { text: "The future belongs to those who believe in the beauty of their dreams.", author: "Eleanor Roosevelt" },
    { text: "It always seems impossible until it's done.", author: "Nelson Mandela" },
    { text: "Believe you can and you're halfway there.", author: "Theodore Roosevelt" },
    { text: "Do what you can, with what you have, where you are.", author: "Theodore Roosevelt" },
    { text: "Act as if what you do makes a difference. It does.", author: "William James" }
  ];

  // Grab references to the elements we need to update
  const quoteText = document.getElementById("quoteText");
  const quoteAuthor = document.getElementById("quoteAuthor");

  // Pick a random quote and display it
  function newQuote() {
    const randomIndex = Math.floor(Math.random() * quotes.length);
    const quote = quotes[randomIndex];

    quoteText.textContent = `"${quote.text}"`;
    quoteAuthor.textContent = "— " + quote.author;
  }

  // Show a random quote as soon as the page loads
  newQuote();
</script>

</body>
</html>
